{% extends "base.html" %}

{% block content %}

<div class="flex justify-center mb-6">
    <form method="POST" class="flex gap-3">
        <input type="text" name="genre" placeholder="Enter genre (e.g. action)"
            class="px-4 py-2 rounded-lg text-black w-72">

        <button type="submit"
            class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600">
            Search
        </button>
    </form>
</div>

{% if movies %}

<h2 class="text-xl font-semibold mb-4 text-center">
    Movies in Genre: {{ genre }}
</h2>

<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">

    {% for movie in movies %}
    <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:scale-105 transition duration-300">

        <img src="{{ movie.poster }}" class="w-full h-72 object-cover">

        <div class="p-3">
            <h3 class="text-lg font-semibold">{{ movie.title }}</h3>
            <p class="text-sm text-gray-400">⭐ {{ movie.rating }}</p>
        </div>

    </div>
    {% endfor %}

</div>

{% endif %}

{% endblock %}
